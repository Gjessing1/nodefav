# Builds the backend image, pushes it to Forgejo's built-in container registry,
# then redeploys on the host. Replicates maily's proven workflow.
#
# Notes specific to this runner (host-Docker-socket model):
# - `runs-on: docker` -> catthehacker/ubuntu:act-latest, which has the docker CLI.
# - docker build/push run against the HOST daemon via the mounted socket.
# - Pushes go to localhost:3000 (Forgejo's host-published HTTP port) rather than
#   git.gjessing.io, because Caddy 413s large layer uploads. Registry storage is
#   hostname-agnostic, so the image is still *pulled* as git.gjessing.io/... as usual.
# - Auth is a PAT with write:package stored as the REGISTRY_TOKEN repo secret; the
#   automatic GITHUB_TOKEN only gets package *read* on this instance.
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  # Public name — what deployments pull (HTTPS via Caddy).
  IMAGE: git.gjessing.io/gjessing1/nodefav-backend
  # Push name — straight to Forgejo's host-published port, avoiding Caddy.
  PUSH_IMAGE: localhost:3000/gjessing1/nodefav-backend

jobs:
  # Single job: the quality gate (format, lint, types, tests) lives INSIDE the image
  # build (backend/Dockerfile), so there is no separate `verify` job and dependencies
  # are installed exactly once per push. Caching is handled by the host BuildKit
  # daemon: the `npm ci` layer is reused whenever package-lock.json is unchanged.
  #
  # The deploy runs in this job too, rather than in a separate `needs:` job: this
  # instance has ONE runner with capacity 1 shared by every repo, so a second job has
  # to queue for another turn on it, often behind atlas's 30-50 minute builds. If a new
  # commit lands during that wait, Forgejo auto-cancels the previous run's still-queued
  # job — the deploy is then silently skipped and a stale container keeps running while
  # the run still shows green.
  build-and-deploy:
    runs-on: docker
    permissions:
      contents: read
      packages: write # not sufficient alone on this instance; push uses REGISTRY_TOKEN (see auth step)
    env:
      DOCKER_BUILDKIT: '1' # required for the Dockerfile's RUN --mount=type=cache npm cache
      # Deploy project (compose file + .env), bind-mounted into the job by the runner.
      DEPLOY_DIR: /home/gjessing/docker/nodefav
    steps:
      - uses: actions/checkout@v4

      # Written directly instead of `docker login`: login pings the registry from the job
      # container (where localhost:3000 is unreachable), but the push runs on the host daemon
      # (where it works). Both hostnames are authed here — pushes go to localhost:3000,
      # the deploy's compose pull to git.gjessing.io.
      - name: Registry auth
        run: |
          mkdir -p ~/.docker
          auth=$(printf 'gjessing1:%s' "${{ secrets.REGISTRY_TOKEN }}" | base64 -w0)
          printf '{"auths":{"localhost:3000":{"auth":"%s"},"git.gjessing.io":{"auth":"%s"}}}' \
            "$auth" "$auth" > ~/.docker/config.json

      - name: Build image
        # --progress=plain so the verbose npm output is readable in the run log. The build
        # runs the quality gate; a failure here means nothing is pushed. Tagged with both
        # the public pull name and the localhost push name so the layers are shared.
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          docker build --progress=plain -f backend/Dockerfile \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t "$IMAGE:latest" -t "$IMAGE:$SHA_TAG" \
            -t "$PUSH_IMAGE:latest" -t "$PUSH_IMAGE:$SHA_TAG" .

      - name: Push image
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          docker push "$PUSH_IMAGE:latest"
          docker push "$PUSH_IMAGE:$SHA_TAG"

      # Versioned extension release zip (Phase 6). The extension-zip target reuses the
      # gated build stage from the image build above, so this is cache-only work; the
      # zip lands in Forgejo's generic package registry (Packages tab of the repo).
      # The upload goes through git.gjessing.io — fine here, the zip is tiny (no 413).
      - name: Package extension
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' extension/src/manifest.json | head -1)
          docker build -f backend/Dockerfile --target extension-zip \
            --output type=local,dest=ext-out .
          FILE="nodefav-extension-$VERSION-$SHA_TAG.zip"
          mv ext-out/nodefav-extension.zip "$FILE"
          curl --fail-with-body -sS -u "gjessing1:${{ secrets.REGISTRY_TOKEN }}" \
            --upload-file "$FILE" \
            "https://git.gjessing.io/api/packages/gjessing1/generic/nodefav-extension/$VERSION-$SHA_TAG/$FILE"
          echo "EXTENSION_ZIP=$FILE" >> "$GITHUB_ENV"
          echo "EXTENSION_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Homepage serves a stable URL, so its download tile always points at
      # the zip from the newest successful main build.
      - name: Update homepage extension download
        if: github.ref == 'refs/heads/main'
        run: |
          cat "$EXTENSION_ZIP" | docker run --rm -i \
            -v /home/gjessing/docker/homepage/downloads:/downloads \
            alpine:3.20 sh -c 'cat > /downloads/nodefav-extension-next.zip && mv /downloads/nodefav-extension-next.zip /downloads/nodefav-extension-latest.zip'

      # Redeploy on the host, against the host daemon via the mounted Docker socket.
      # Pulls git.gjessing.io/...:latest — the image just pushed above. Guarded on main
      # because this workflow also runs for v* tags and workflow_dispatch.
      - name: Pull and restart
        if: github.ref == 'refs/heads/main'
        run: |
          cd "$DEPLOY_DIR"
          docker compose pull
          docker compose up -d --remove-orphans

      # Fail loudly if the stack came back on the old image, so a lost deploy shows up
      # as a red run instead of a green one with a stale container.
      - name: Verify deploy
        if: github.ref == 'refs/heads/main'
        run: |
          cd "$DEPLOY_DIR"
          built=$(docker image inspect --format '{{.Id}}' "$IMAGE:latest")
          running=$(docker compose ps -q | xargs -r docker inspect --format '{{.Image}}')
          if ! printf '%s\n' "$running" | grep -qFx "$built"; then
            echo "no running container uses the image just built ($built)" >&2
            docker compose ps >&2
            exit 1
          fi
          echo "deployed $built"

      # Submit the same zip to the Chrome Web Store when its manifest version is newer
      # than what the store publishes or is reviewing (an older pending review is
      # replaced); otherwise a no-op. Runs last so a store problem never blocks the
      # deploy. Skips quietly until the CWS_* secrets exist (see README).
      - name: Publish to Chrome Web Store
        if: github.ref == 'refs/heads/main'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node extension/scripts/publish-webstore.mjs "$EXTENSION_ZIP" "$EXTENSION_VERSION"
